<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediaTube - Telegram App</title>

    <!-- External Libraries -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Compat SDKs (For Single File Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            500: '#ff0033',
                            600: '#cc0029',
                            dark: '#0a0a0c',
                            card: '#121216',
                            border: '#1f1f26'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0a0c;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .video-aspect { position: relative; padding-top: 56.25%; }
        .video-aspect iframe, .video-aspect video, .video-aspect img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .skeleton {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col bg-brand-dark pb-24 border-x border-brand-border/40 shadow-2xl">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-xs pointer-events-none"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-header px-4 py-3 border-b border-brand-border flex items-center justify-between">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="navigateTo('home-page')">
            <div class="bg-gradient-to-tr from-brand-600 to-brand-500 text-white p-2 rounded-xl shadow-lg shadow-brand-500/20">
                <i data-lucide="play" class="w-4 h-4 fill-white"></i>
            </div>
            <span class="font-extrabold text-lg tracking-tight text-white">Media<span class="text-brand-500">Tube</span></span>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="navigateTo('search-page')" class="p-2 text-zinc-400 hover:text-white rounded-full hover:bg-brand-card transition-all">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
            <div onclick="navigateTo('profile-page')" class="w-8 h-8 rounded-full bg-brand-card overflow-hidden cursor-pointer border border-brand-border flex items-center justify-center ring-2 ring-transparent hover:ring-brand-500/50 transition-all">
                <img id="header-avatar" src="" alt="" class="w-full h-full object-cover hidden">
                <span id="header-avatar-initial" class="text-xs font-bold text-brand-500">U</span>
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-grow space-y-4">

        <!-- HOME PAGE -->
        <div id="home-page" class="sub-page active p-3.5 space-y-4">
            <!-- Categories Pills -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-semibold">
                <button onclick="filterCategory('All')" class="cat-btn px-4 py-2 rounded-xl bg-white text-black shadow-sm font-bold whitespace-nowrap transition-all">All</button>
                <button onclick="filterCategory('Tutorial')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card text-zinc-400 hover:text-white border border-brand-border whitespace-nowrap transition-all">Tutorials</button>
                <button onclick="filterCategory('Tech')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card text-zinc-400 hover:text-white border border-brand-border whitespace-nowrap transition-all">Tech</button>
                <button onclick="filterCategory('Music')" class="cat-btn px-4 py-2 rounded-xl bg-brand-card text-zinc-400 hover:text-white border border-brand-border whitespace-nowrap transition-all">Music</button>
            </div>

            <!-- Feed Container -->
            <div id="video-feed-container" class="space-y-4">
                <!-- Skeleton Loader -->
                <div class="bg-brand-card rounded-2xl overflow-hidden border border-brand-border space-y-3 p-3">
                    <div class="video-aspect rounded-xl skeleton"></div>
                    <div class="h-4 skeleton rounded-lg w-3/4"></div>
                    <div class="h-3 skeleton rounded-lg w-1/2"></div>
                </div>
            </div>
        </div>

        <!-- WATCH PAGE -->
        <div id="watch-page" class="sub-page space-y-4">
            <div class="sticky top-0 z-50 bg-black shadow-xl">
                <div class="video-aspect">
                    <iframe id="video-player-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>

            <div class="p-3.5 space-y-4">
                <div>
                    <h1 id="watch-video-title" class="text-base font-bold text-white leading-snug">Loading...</h1>
                    <p id="watch-video-meta" class="text-xs text-zinc-400 mt-1">0 views • Recently added</p>
                </div>

                <!-- Action Bar -->
                <div class="grid grid-cols-3 gap-2 bg-brand-card border border-brand-border p-2 rounded-2xl text-center">
                    <button id="like-btn" onclick="toggleLikeCurrentVideo()" class="flex items-center justify-center gap-2 py-2 text-zinc-300 hover:text-white rounded-xl active:bg-zinc-800/50 transition-all">
                        <i data-lucide="thumbs-up" class="w-4 h-4"></i>
                        <span id="watch-like-count" class="text-xs font-semibold">0</span>
                    </button>
                    <button onclick="downloadCurrentVideo()" class="flex items-center justify-center gap-2 py-2 text-zinc-300 hover:text-white rounded-xl active:bg-zinc-800/50 transition-all">
                        <i data-lucide="bookmark" class="w-4 h-4"></i>
                        <span class="text-xs font-semibold">Save</span>
                    </button>
                    <button onclick="shareCurrentVideo()" class="flex items-center justify-center gap-2 py-2 text-zinc-300 hover:text-white rounded-xl active:bg-zinc-800/50 transition-all">
                        <i data-lucide="share-2" class="w-4 h-4"></i>
                        <span class="text-xs font-semibold">Share</span>
                    </button>
                </div>

                <!-- Channel / Description -->
                <div class="bg-brand-card p-3.5 rounded-2xl border border-brand-border text-xs text-zinc-300 space-y-2">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full bg-brand-500/20 text-brand-500 border border-brand-500/30 flex items-center justify-center font-extrabold text-xs">M</div>
                        <div>
                            <p id="watch-channel-name" class="font-bold text-white">MediaTube Official</p>
                            <p class="text-[10px] text-zinc-400">Verified Channel</p>
                        </div>
                    </div>
                    <p id="watch-video-desc" class="text-zinc-400 pt-1 text-xs leading-relaxed">No description provided.</p>
                </div>

                <!-- Comments Section -->
                <div class="space-y-3 pt-2">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <span>Comments</span>
                        <span id="comments-count" class="text-xs text-brand-500 font-bold bg-brand-500/10 px-2 py-0.5 rounded-full">0</span>
                    </h3>

                    <div class="flex items-center gap-2">
                        <input type="text" id="comment-input" placeholder="Add a public comment..." class="flex-grow bg-brand-card border border-brand-border rounded-xl py-2.5 px-3.5 text-xs text-white focus:outline-none focus:border-brand-500 transition-all">
                        <button onclick="submitComment()" class="bg-brand-500 hover:bg-brand-600 text-white p-2.5 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/20 active:scale-95 transition-all">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div id="comments-container" class="space-y-2 max-h-56 overflow-y-auto no-scrollbar pr-1"></div>
                </div>

                <hr class="border-brand-border/60 my-4">

                <!-- Suggested Videos -->
                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-white">Suggested Videos</h3>
                    <div id="suggested-videos-container" class="space-y-2.5"></div>
                </div>
            </div>
        </div>

        <!-- SEARCH PAGE -->
        <div id="search-page" class="sub-page p-3.5 space-y-4">
            <div class="relative">
                <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Search videos, tutorials..." class="w-full bg-brand-card border border-brand-border rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-brand-500 transition-all">
                <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
            </div>

            <div id="search-results-container" class="space-y-3">
                <p class="text-xs text-zinc-500 text-center py-12">Search by typing keywords above...</p>
            </div>
        </div>

        <!-- SAVED/DOWNLOADS PAGE -->
        <div id="download-page" class="sub-page p-3.5 space-y-4">
            <div class="flex items-center justify-between border-b border-brand-border pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="bookmark" class="w-5 h-5 text-brand-500"></i>
                    <span>Saved Videos</span>
                </h2>
                <span id="download-count-badge" class="text-xs bg-brand-card border border-brand-border text-brand-500 px-2.5 py-1 rounded-full font-bold">0</span>
            </div>

            <div id="download-list-container" class="space-y-3"></div>
        </div>

        <!-- PROFILE PAGE -->
        <div id="profile-page" class="sub-page p-3.5 space-y-4">
            <div class="bg-brand-card border border-brand-border rounded-2xl p-5 text-center space-y-3 relative overflow-hidden shadow-lg">
                <div class="w-20 h-20 mx-auto rounded-full bg-zinc-800 border-2 border-brand-500 p-0.5 overflow-hidden flex items-center justify-center shadow-xl shadow-brand-500/10">
                    <img id="profile-pic" src="" alt="Profile" class="w-full h-full object-cover rounded-full hidden">
                    <span id="profile-initial" class="text-2xl font-black text-brand-500">U</span>
                </div>

                <div>
                    <h3 id="profile-name" class="text-base font-bold text-white">Telegram User</h3>
                    <p id="profile-username" class="text-xs text-zinc-400 mt-0.5">@username</p>
                </div>

                <div class="pt-3 border-t border-brand-border grid grid-cols-1 gap-2 text-left text-xs">
                    <div class="bg-zinc-900/50 p-3 rounded-xl border border-brand-border flex items-center gap-3">
                        <i data-lucide="id-card" class="w-4 h-4 text-brand-500"></i>
                        <div>
                            <p class="text-[9px] text-zinc-500 uppercase font-extrabold tracking-wider">Telegram User ID</p>
                            <p id="profile-id" class="font-mono text-zinc-200 text-xs mt-0.5">N/A</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-brand-card border border-brand-border p-3.5 rounded-2xl">
                    <p class="text-[9px] text-zinc-500 uppercase font-extrabold tracking-wider">Saved Items</p>
                    <p id="stat-download-count" class="text-xl font-black text-brand-500 mt-1">0</p>
                </div>
                <div class="bg-brand-card border border-brand-border p-3.5 rounded-2xl">
                    <p class="text-[9px] text-zinc-500 uppercase font-extrabold tracking-wider">App Version</p>
                    <p class="text-xl font-black text-zinc-300 mt-1">v3.0 Pro</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-header border-t border-brand-border flex justify-around items-center py-2.5 z-40">
        <button onclick="navigateTo('home-page')" class="nav-item flex flex-col items-center gap-1 text-brand-500 text-[10px] font-bold" data-page="home-page">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span>Home</span>
        </button>
        <button onclick="navigateTo('search-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-500 text-[10px] font-medium hover:text-zinc-300 transition-all" data-page="search-page">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span>Search</span>
        </button>
        <button onclick="navigateTo('download-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-500 text-[10px] font-medium hover:text-zinc-300 transition-all" data-page="download-page">
            <i data-lucide="bookmark" class="w-5 h-5"></i>
            <span>Saved</span>
        </button>
        <button onclick="navigateTo('profile-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-500 text-[10px] font-medium hover:text-zinc-300 transition-all" data-page="profile-page">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- APP SCRIPT LOGIC -->
    <script>
        // ============================================================
        // 1. FIREBASE CONFIGURATION (YOUR REAL KEYS INTEGRATED)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDCRUcx2CtNx7iWEvvINnwVtycv7MS80jk",
            authDomain: "video-r0om-bot.firebaseapp.com",
            projectId: "video-r0om-bot",
            storageBucket: "video-r0om-bot.firebasestorage.app",
            messagingSenderId: "848251152121",
            appId: "1:848251152121:web:9981c76985b4f385eda428"
        };

        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (e) {
            console.warn("Firebase initialized with local fallback handling:", e);
        }

        // ============================================================
        // SAMPLE DEMO DATA (Fallback if Firebase Firestore is empty)
        // ============================================================
        const demoVideos = [
            {
                id: "demo-1",
                title: "Build a Telegram Mini App with HTML & Firebase",
                category: "Tech",
                views: "1.2K",
                duration: "10:25",
                thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80",
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                desc: "Learn step-by-step how to integrate Firebase Firestore inside Telegram WebApps.",
                likes: 42,
                comments: [{ user: "Alex", text: "Awesome project layout!" }]
            },
            {
                id: "demo-2",
                title: "Tailwind CSS Responsive Design Masterclass",
                category: "Tutorial",
                views: "850",
                duration: "08:15",
                thumbnail: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&auto=format&fit=crop&q=80",
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                desc: "Master mobile-first dark mode layouts with modern Tailwind utility classes.",
                likes: 19,
                comments: []
            }
        ];

        // GLOBAL APP STATE
        let videosDatabase = [];
        let currentActiveVideo = null;
        let downloadedVideos = JSON.parse(localStorage.getItem('mediatube_saved') || '[]');
        let currentUser = { name: "Telegram User", username: "username", photo: "" };

        // INITIALIZATION ON LOAD
        window.onload = () => {
            lucide.createIcons();
            initTelegramProfile();
            fetchVideosFromFirebase();
            updateDownloadUI();
        };

        // TELEGRAM PROFILE SETUP
        function initTelegramProfile() {
            try {
                if (window.Telegram?.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();

                    const user = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (user) {
                        const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || "Telegram User";
                        currentUser.name = fullName;
                        currentUser.username = user.username ? `@${user.username}` : "No Username";

                        document.getElementById('profile-name').textContent = currentUser.name;
                        document.getElementById('profile-username').textContent = currentUser.username;
                        document.getElementById('profile-id').textContent = user.id || "N/A";

                        if (user.photo_url) {
                            currentUser.photo = user.photo_url;
                            document.getElementById('profile-pic').src = user.photo_url;
                            document.getElementById('profile-pic').classList.remove('hidden');
                            document.getElementById('profile-initial').classList.add('hidden');

                            document.getElementById('header-avatar').src = user.photo_url;
                            document.getElementById('header-avatar').classList.remove('hidden');
                            document.getElementById('header-avatar-initial').classList.add('hidden');
                        } else {
                            const initial = (user.first_name?.[0] || 'U').toUpperCase();
                            document.getElementById('profile-initial').textContent = initial;
                            document.getElementById('header-avatar-initial').textContent = initial;
                        }
                    }
                }
            } catch (e) {
                console.log("Telegram SDK execution notice:", e);
            }
        }

        // TOAST NOTIFICATION SYSTEM
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-zinc-900 border border-brand-border text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'info'}" class="w-4 h-4 text-brand-500"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // HELPER: Extract Embed URL for YouTube
        function parseEmbedUrl(urlOrId) {
            if (!urlOrId) return 'https://www.youtube.com/embed/';
            if (urlOrId.includes('youtube.com/embed/')) return urlOrId;
            
            let videoId = urlOrId;
            const match = urlOrId.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (match && match[1]) {
                videoId = match[1];
            }
            return `https://www.youtube.com/embed/${videoId}`;
        }

        // FETCH VIDEOS FROM FIREBASE
        function fetchVideosFromFirebase() {
            if (!db) {
                videosDatabase = demoVideos;
                renderVideoFeed(videosDatabase);
                return;
            }

            db.collection("videos").get().then((querySnapshot) => {
                videosDatabase = [];
                querySnapshot.forEach((doc) => {
                    videosDatabase.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Fallback to Demo Videos if Database is Empty
                if (videosDatabase.length === 0) {
                    videosDatabase = demoVideos;
                }

                renderVideoFeed(videosDatabase);
            }).catch((error) => {
                console.error("Firestore Fetch Notice:", error);
                videosDatabase = demoVideos;
                renderVideoFeed(videosDatabase);
            });
        }

        // NAVIGATION LOGIC
        function navigateTo(pageId) {
            document.querySelectorAll('.sub-page').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(btn => {
                const isActive = btn.dataset.page === pageId;
                btn.classList.toggle('text-brand-500', isActive);
                btn.classList.toggle('font-bold', isActive);
                btn.classList.toggle('text-zinc-500', !isActive);
            });

            if (pageId !== 'watch-page') {
                document.getElementById('video-player-iframe').src = "";
            }

            if (pageId === 'download-page') updateDownloadUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        // RENDER HOME FEED
        function renderVideoFeed(videos) {
            const container = document.getElementById('video-feed-container');
            if (videos.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-10">No videos found.</p>`;
                return;
            }

            container.innerHTML = videos.map(v => `
                <div class="bg-brand-card rounded-2xl overflow-hidden border border-brand-border shadow-md group">
                    <div class="video-aspect cursor-pointer overflow-hidden" onclick="openWatchPage('${v.id}')">
                        <img src="${v.thumbnail || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" alt="${v.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <span class="absolute bottom-2.5 right-2.5 bg-black/80 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded-lg border border-white/10">${v.duration || '00:00'}</span>
                    </div>

                    <div class="p-3.5 flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-brand-500/10 text-brand-500 flex items-center justify-center font-bold text-xs flex-shrink-0 border border-brand-500/20">
                            <i data-lucide="play" class="w-4 h-4 fill-brand-500"></i>
                        </div>
                        <div class="flex-grow">
                            <h3 onclick="openWatchPage('${v.id}')" class="font-bold text-xs text-white line-clamp-2 cursor-pointer hover:text-brand-500 transition-colors leading-snug">${v.title}</h3>
                            <p class="text-[10px] text-zinc-400 mt-1">${v.category || 'General'} • ${v.views || '0'} views</p>
                        </div>
                        <button onclick="downloadVideoById('${v.id}')" class="p-2 text-zinc-400 hover:text-brand-500 rounded-xl hover:bg-zinc-800 transition-all">
                            <i data-lucide="bookmark" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // WATCH PAGE
        function openWatchPage(videoId) {
            const video = videosDatabase.find(v => v.id === videoId);
            if (!video) return;

            currentActiveVideo = video;

            const finalEmbed = parseEmbedUrl(video.embedUrl || video.youtubeId || video.id);
            document.getElementById('video-player-iframe').src = finalEmbed + "?autoplay=1";

            document.getElementById('watch-video-title').textContent = video.title;
            document.getElementById('watch-video-meta').textContent = `${video.views || '0'} views • ${video.category || 'General'}`;
            document.getElementById('watch-video-desc').textContent = video.desc || "No description provided.";
            document.getElementById('watch-like-count').textContent = video.likes || 0;

            renderComments(video.comments || []);
            renderSuggestedVideos(videoId);

            const likeBtn = document.getElementById('like-btn');
            likeBtn.classList.remove('text-brand-500');
            likeBtn.classList.add('text-zinc-300');

            navigateTo('watch-page');
        }

        // SUGGESTED VIDEOS
        function renderSuggestedVideos(currentId) {
            const container = document.getElementById('suggested-videos-container');
            const suggested = videosDatabase.filter(v => v.id !== currentId);

            if (suggested.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">No suggested videos available.</p>`;
                return;
            }

            container.innerHTML = suggested.map(v => `
                <div class="flex items-center gap-3 bg-brand-card p-2.5 rounded-xl border border-brand-border cursor-pointer hover:border-zinc-700 transition-all" onclick="openWatchPage('${v.id}')">
                    <div class="w-24 h-14 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0 relative">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover" alt="">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-[8px] font-bold px-1 rounded text-white">${v.duration || ''}</span>
                    </div>
                    <div class="flex-grow overflow-hidden">
                        <h4 class="text-xs font-bold text-white line-clamp-2">${v.title}</h4>
                        <p class="text-[10px] text-zinc-400 mt-1">${v.views || '0'} views</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // LIKE & COMMENT HANDLERS
        function toggleLikeCurrentVideo() {
            if (!currentActiveVideo) return;

            const likeBtn = document.getElementById('like-btn');
            const likeCountEl = document.getElementById('watch-like-count');
            let currentLikes = parseInt(likeCountEl.textContent) || 0;

            if (likeBtn.classList.contains('text-brand-500')) {
                currentLikes--;
                likeBtn.classList.remove('text-brand-500');
                likeBtn.classList.add('text-zinc-300');
            } else {
                currentLikes++;
                likeBtn.classList.add('text-brand-500');
                likeBtn.classList.remove('text-zinc-300');
                showToast("Liked video!", "success");
            }

            likeCountEl.textContent = currentLikes;
            currentActiveVideo.likes = currentLikes;

            if (db && currentActiveVideo.id && !currentActiveVideo.id.startsWith('demo-')) {
                db.collection("videos").doc(currentActiveVideo.id).update({
                    likes: currentLikes
                }).catch(err => console.log("Firestore update skipped:", err));
            }
        }

        function renderComments(comments) {
            const container = document.getElementById('comments-container');
            document.getElementById('comments-count').textContent = comments.length;

            if (comments.length === 0) {
                container.innerHTML = `<p class="text-[11px] text-zinc-500 py-3 text-center">No comments yet. Be the first to comment!</p>`;
                return;
            }

            container.innerHTML = comments.map(c => `
                <div class="bg-brand-card p-2.5 rounded-xl border border-brand-border space-y-1">
                    <div class="flex items-center gap-2">
                        <div class="w-5 h-5 rounded-full bg-brand-500/20 text-brand-500 flex items-center justify-center text-[9px] font-bold">
                            ${c.user ? c.user[0].toUpperCase() : 'U'}
                        </div>
                        <span class="text-[11px] font-bold text-zinc-300">${c.user || 'User'}</span>
                    </div>
                    <p class="text-xs text-zinc-200 pl-7">${c.text}</p>
                </div>
            `).join('');
        }

        function submitComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();

            if (!text || !currentActiveVideo) return;

            const newComment = {
                user: currentUser.name,
                text: text,
                timestamp: new Date().toISOString()
            };

            if (!currentActiveVideo.comments) currentActiveVideo.comments = [];
            currentActiveVideo.comments.unshift(newComment);

            renderComments(currentActiveVideo.comments);
            input.value = "";
            showToast("Comment added!", "success");

            if (db && currentActiveVideo.id && !currentActiveVideo.id.startsWith('demo-')) {
                db.collection("videos").doc(currentActiveVideo.id).update({
                    comments: firebase.firestore.FieldValue.arrayUnion(newComment)
                }).catch(err => console.log("Firestore comment update skipped:", err));
            }
        }

        // SEARCH & FILTER LOGIC
        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('search-results-container');

            if (!query) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-12">Search by typing keywords above...</p>`;
                return;
            }

            const results = videosDatabase.filter(v => 
                v.title.toLowerCase().includes(query) || 
                (v.category && v.category.toLowerCase().includes(query))
            );

            if (results.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-12">No video results found.</p>`;
                return;
            }

            container.innerHTML = results.map(v => `
                <div class="flex items-center gap-3 bg-brand-card p-2.5 rounded-xl border border-brand-border cursor-pointer hover:border-zinc-700 transition-all" onclick="openWatchPage('${v.id}')">
                    <img src="${v.thumbnail}" class="w-24 h-14 object-cover rounded-lg flex-shrink-0" alt="">
                    <div class="flex-grow">
                        <h4 class="text-xs font-bold text-white line-clamp-2">${v.title}</h4>
                        <p class="text-[10px] text-zinc-400 mt-1">${v.views || '0'} views</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const isActive = btn.textContent.trim() === cat;
                btn.className = `cat-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    isActive ? 'bg-white text-black font-bold shadow-sm' : 'bg-brand-card text-zinc-400 hover:text-white border border-brand-border'
                }`;
            });

            if (cat === 'All') {
                renderVideoFeed(videosDatabase);
            } else {
                const filtered = videosDatabase.filter(v => v.category === cat);
                renderVideoFeed(filtered);
            }
        }

        // SAVED / WATCH LATER SYSTEM
        function downloadVideoById(videoId) {
            const video = videosDatabase.find(v => v.id === videoId);
            if (!video) return;

            if (downloadedVideos.some(item => item.id === video.id)) {
                showToast("Already saved to your list!");
                return;
            }

            downloadedVideos.push(video);
            localStorage.setItem('mediatube_saved', JSON.stringify(downloadedVideos));
            showToast("Saved to your watch list!", "success");
            updateDownloadUI();
        }

        function downloadCurrentVideo() {
            if (currentActiveVideo) downloadVideoById(currentActiveVideo.id);
        }

        function updateDownloadUI() {
            const container = document.getElementById('download-list-container');
            const countBadge = document.getElementById('download-count-badge');
            const statCount = document.getElementById('stat-download-count');

            countBadge.textContent = downloadedVideos.length;
            statCount.textContent = downloadedVideos.length;

            if (downloadedVideos.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-12">No saved videos yet.</p>`;
                return;
            }

            container.innerHTML = downloadedVideos.map(v => `
                <div class="flex items-center justify-between bg-brand-card p-2.5 rounded-xl border border-brand-border">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="openWatchPage('${v.id}')">
                        <img src="${v.thumbnail}" class="w-16 h-10 object-cover rounded-lg" alt="">
                        <div>
                            <h4 class="text-xs font-bold text-white line-clamp-1">${v.title}</h4>
                            <p class="text-[10px] text-zinc-400 mt-0.5">${v.duration || ''}</p>
                        </div>
                    </div>
                    <button onclick="removeDownload('${v.id}')" class="p-2 text-zinc-500 hover:text-brand-500 rounded-lg transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeDownload(videoId) {
            downloadedVideos = downloadedVideos.filter(v => v.id !== videoId);
            localStorage.setItem('mediatube_saved', JSON.stringify(downloadedVideos));
            showToast("Item removed");
            updateDownloadUI();
        }

        function shareCurrentVideo() {
            if (currentActiveVideo) {
                const videoUrl = parseEmbedUrl(currentActiveVideo.embedUrl || currentActiveVideo.id);
                navigator.clipboard.writeText(videoUrl);
                showToast("Link copied to clipboard!", "success");
            }
        }
    </script>
</body>
</html>

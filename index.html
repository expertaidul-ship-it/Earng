<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaTube - Telegram App</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            -webkit-user-select: none;
            user-select: none;
        }
        .video-thumbnail-wrapper {
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .video-thumbnail-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .nav-active {
            color: #ef4444 !important;
        }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.25s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #272727; border-radius: 4px; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col bg-[#0f0f0f] pb-20">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-[#0f0f0f]/95 backdrop-blur-md px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home-page')">
            <div class="bg-red-600 text-white p-1.5 rounded-xl">
                <i data-lucide="play" class="w-5 h-5 fill-white"></i>
            </div>
            <span class="font-extrabold text-lg tracking-tight text-white">Media<span class="text-red-600">Tube</span></span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="navigateTo('search-page')" class="p-2 text-zinc-300 hover:text-white rounded-full hover:bg-zinc-800">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
            <div onclick="navigateTo('profile-page')" class="w-8 h-8 rounded-full bg-zinc-700 overflow-hidden cursor-pointer border border-zinc-700 flex items-center justify-center">
                <img id="header-avatar" src="" alt="" class="w-full h-full object-cover hidden">
                <span id="header-avatar-initial" class="text-xs font-bold text-white">U</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow p-3 space-y-4">

        <!-- 1. HOME PAGE (VIDEO FEED) -->
        <div id="home-page" class="sub-page active space-y-4">
            
            <!-- Category Chips -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-medium">
                <button onclick="filterCategory('All')" class="px-3.5 py-1.5 rounded-lg bg-white text-black font-semibold whitespace-nowrap cat-btn">All</button>
                <button onclick="filterCategory('Tutorial')" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700 whitespace-nowrap cat-btn">Tutorials</button>
                <button onclick="filterCategory('Tech')" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700 whitespace-nowrap cat-btn">Tech</button>
                <button onclick="filterCategory('Music')" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700 whitespace-nowrap cat-btn">Music</button>
            </div>

            <!-- Video Feed Grid -->
            <div id="video-feed-container" class="space-y-5">
                <!-- Videos will load dynamically -->
            </div>
        </div>

        <!-- 2. SEARCH PAGE -->
        <div id="search-page" class="sub-page space-y-4">
            <div class="relative">
                <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Search videos, tutorials..." class="w-full bg-zinc-900 border border-zinc-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-red-500">
                <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
            </div>

            <div id="search-results-container" class="space-y-4">
                <p class="text-xs text-zinc-500 text-center py-8">ভিডিও খুঁজতে উপরে টাইপ করুন...</p>
            </div>
        </div>

        <!-- 3. DOWNLOADS PAGE -->
        <div id="download-page" class="sub-page space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="download" class="w-5 h-5 text-red-500"></i>
                    <span>Downloaded Videos</span>
                </h2>
                <span id="download-count-badge" class="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-full font-bold">0</span>
            </div>

            <div id="download-list-container" class="space-y-3">
                <!-- Downloaded items will be listed here -->
            </div>
        </div>

        <!-- 4. PROFILE PAGE -->
        <div id="profile-page" class="sub-page space-y-4">
            <!-- User Profile Card -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center space-y-3 relative overflow-hidden">
                <div class="w-20 h-20 mx-auto rounded-full bg-zinc-800 border-2 border-red-600 overflow-hidden flex items-center justify-center shadow-lg">
                    <img id="profile-pic" src="" alt="Profile" class="w-full h-full object-cover hidden">
                    <span id="profile-initial" class="text-2xl font-bold text-zinc-300">U</span>
                </div>

                <div>
                    <h3 id="profile-name" class="text-lg font-bold text-white">Loading...</h3>
                    <p id="profile-username" class="text-xs text-zinc-400">@username</p>
                </div>

                <div class="pt-3 border-t border-zinc-800/80 grid grid-cols-1 gap-2 text-left text-xs">
                    <div class="bg-zinc-800/60 p-2.5 rounded-xl flex items-center gap-3">
                        <i data-lucide="id-card" class="w-4 h-4 text-red-500"></i>
                        <div>
                            <p class="text-[10px] text-zinc-500 uppercase font-bold">Telegram ID</p>
                            <p id="profile-id" class="font-mono text-zinc-200">N/A</p>
                        </div>
                    </div>

                    <div class="bg-zinc-800/60 p-2.5 rounded-xl flex items-center gap-3">
                        <i data-lucide="phone" class="w-4 h-4 text-emerald-500"></i>
                        <div class="flex-grow">
                            <p class="text-[10px] text-zinc-500 uppercase font-bold">Contact Phone Number</p>
                            <p id="profile-phone" class="font-mono text-zinc-200">+8801855879942</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">Saved Videos</p>
                    <p id="stat-download-count" class="text-lg font-black text-red-500">0</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">App Version</p>
                    <p class="text-lg font-black text-zinc-300">v2.0</p>
                </div>
            </div>
        </div>

    </main>

    <!-- VIDEO WATCH MODAL -->
    <div id="watch-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
        <div class="p-3 flex items-center justify-between border-b border-zinc-800">
            <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Now Playing</span>
            <button onclick="closeWatchModal()" class="p-1.5 text-zinc-400 hover:text-white rounded-full bg-zinc-800">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="w-full bg-black">
            <div class="video-thumbnail-wrapper">
                <iframe id="video-player-iframe" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <div class="p-4 flex-grow overflow-y-auto space-y-4">
            <div>
                <h2 id="modal-video-title" class="text-base font-bold text-white">Video Title Loading...</h2>
                <p id="modal-video-views" class="text-xs text-zinc-400 mt-1">0 views • Just now</p>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-around border-y border-zinc-800 py-3">
                <button class="flex flex-col items-center gap-1 text-zinc-400 hover:text-white">
                    <i data-lucide="thumbs-up" class="w-5 h-5"></i>
                    <span class="text-[10px]">Like</span>
                </button>
                <button onclick="downloadCurrentVideo()" class="flex flex-col items-center gap-1 text-red-500 hover:text-red-400">
                    <i data-lucide="download" class="w-5 h-5"></i>
                    <span class="text-[10px] font-bold">Download</span>
                </button>
                <button onclick="shareCurrentVideo()" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-white">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                    <span class="text-[10px]">Share</span>
                </button>
            </div>

            <!-- Description -->
            <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800 text-xs text-zinc-300 space-y-1">
                <p class="font-bold text-white">Description:</p>
                <p id="modal-video-desc">No description available for this video.</p>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0f0f0f]/95 backdrop-blur-md border-t border-zinc-800 flex justify-around items-center py-2 z-40">
        <button onclick="navigateTo('home-page')" class="nav-item active flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="home-page">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span>Home</span>
        </button>
        <button onclick="navigateTo('search-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="search-page">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span>Search</span>
        </button>
        <button onclick="navigateTo('download-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="download-page">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span>Downloads</span>
        </button>
        <button onclick="navigateTo('profile-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="profile-page">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- SCRIPT LOGIC -->
    <script>
        // SAMPLE VIDEO DATABASE
        const sampleVideos = [
            {
                id: "yy-ELf7JpMw",
                title: "How to Work & Earn Money Online - Complete Tutorial",
                category: "Tutorial",
                views: "12.5K views",
                duration: "10:15",
                thumbnail: "https://img.youtube.com/vi/yy-ELf7JpMw/hqdefault.jpg",
                embedUrl: "https://www.youtube.com/embed/yy-ELf7JpMw",
                desc: "Learn step-by-step methods to complete tasks and build your skills easily online."
            },
            {
                id: "dQw4w9WgXcQ",
                title: "Top Tech Skills in 2025 - Beginner Friendly Guide",
                category: "Tech",
                views: "45K views",
                duration: "03:32",
                thumbnail: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg",
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                desc: "Explore top modern tech trends and tips for mobile developers."
            },
            {
                id: "L_LUpnjgPso",
                title: "Relaxing Music & Background Sounds for Study",
                category: "Music",
                views: "8.1K views",
                duration: "15:40",
                thumbnail: "https://img.youtube.com/vi/L_LUpnjgPso/hqdefault.jpg",
                embedUrl: "https://www.youtube.com/embed/L_LUpnjgPso",
                desc: "Calm and peaceful background audio to keep you focused on your work."
            }
        ];

        let currentActiveVideo = null;
        let downloadedVideos = JSON.parse(localStorage.getItem('my_downloads') || '[]');

        window.onload = () => {
            lucide.createIcons();
            initTelegramProfile();
            renderVideoFeed(sampleVideos);
            updateDownloadUI();
        };

        // TELEGRAM PROFILE INITIALIZATION
        function initTelegramProfile() {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();

                const user = window.Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || "Telegram User";
                    document.getElementById('profile-name').textContent = fullName;
                    document.getElementById('profile-username').textContent = user.username ? `@${user.username}` : "No Username";
                    document.getElementById('profile-id').textContent = user.id || "N/A";
                    
                    // Display Telegram contact phone number if available
                    if (user.phone_number) {
                        document.getElementById('profile-phone').textContent = "+" + user.phone_number;
                    }

                    if (user.photo_url) {
                        document.getElementById('profile-pic').src = user.photo_url;
                        document.getElementById('profile-pic').classList.remove('hidden');
                        document.getElementById('profile-initial').classList.add('hidden');

                        document.getElementById('header-avatar').src = user.photo_url;
                        document.getElementById('header-avatar').classList.remove('hidden');
                        document.getElementById('header-avatar-initial').classList.add('hidden');
                    } else {
                        const initial = (user.first_name?.[0] || 'U').toUpperCase();
                        document.getElementById('profile-initial').textContent = initial;
                        document.getElementById('header-avatar-initial').textContent = initial;
                    }
                }
            } catch (e) {
                console.log("Telegram SDK Error:", e);
            }
        }

        // NAVIGATION LOGIC
        function navigateTo(pageId) {
            document.querySelectorAll('.sub-page').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('nav-active', btn.dataset.page === pageId);
            });

            if (pageId === 'download-page') updateDownloadUI();
            lucide.createIcons();
        }

        // RENDER VIDEO FEED
        function renderVideoFeed(videos) {
            const container = document.getElementById('video-feed-container');
            if (videos.length === 0) {
                container.innerHTML = '<p class="text-zinc-500 text-center py-6 text-xs">কোনো ভিডিও পাওয়া যায়নি।</p>';
                return;
            }

            container.innerHTML = videos.map(v => `
                <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800/80 shadow-md">
                    <div class="video-thumbnail-wrapper cursor-pointer" onclick="openWatchModal('${v.id}')">
                        <img src="${v.thumbnail}" alt="${v.title}" loading="lazy">
                        <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${v.duration}</span>
                    </div>

                    <div class="p-3 flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-red-600/20 text-red-500 flex items-center justify-center font-bold text-xs flex-shrink-0">
                            <i data-lucide="play" class="w-4 h-4 fill-red-500"></i>
                        </div>
                        <div class="flex-grow">
                            <h3 onclick="openWatchModal('${v.id}')" class="font-bold text-sm text-white line-clamp-2 cursor-pointer hover:text-red-400">${v.title}</h3>
                            <p class="text-xs text-zinc-400 mt-1">${v.category} • ${v.views}</p>
                        </div>
                        <button onclick="downloadVideoById('${v.id}')" class="p-1.5 text-zinc-400 hover:text-red-500 rounded-lg">
                            <i data-lucide="download" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // WATCH VIDEO MODAL LOGIC
        function openWatchModal(videoId) {
            const video = sampleVideos.find(v => v.id === videoId);
            if (!video) return;

            currentActiveVideo = video;
            document.getElementById('video-player-iframe').src = video.embedUrl + "?autoplay=1";
            document.getElementById('modal-video-title').textContent = video.title;
            document.getElementById('modal-video-views').textContent = `${video.views} • ${video.category}`;
            document.getElementById('modal-video-desc').textContent = video.desc;

            document.getElementById('watch-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeWatchModal() {
            document.getElementById('video-player-iframe').src = "";
            document.getElementById('watch-modal').classList.add('hidden');
            currentActiveVideo = null;
        }

        // CATEGORY FILTER
        function filterCategory(cat) {
            if (cat === 'All') {
                renderVideoFeed(sampleVideos);
            } else {
                const filtered = sampleVideos.filter(v => v.category === cat);
                renderVideoFeed(filtered);
            }
        }

        // SEARCH FUNCTIONALITY
        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('search-results-container');

            if (!query) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">ভিডিও খুঁজতে উপরে টাইপ করুন...</p>';
                return;
            }

            const results = sampleVideos.filter(v => 
                v.title.toLowerCase().includes(query) || 
                v.category.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">কোনো ফলাফল পাওয়া যায়নি।</p>';
                return;
            }

            container.innerHTML = results.map(v => `
                <div class="flex items-center gap-3 bg-zinc-900 p-2 rounded-xl border border-zinc-800">
                    <img src="${v.thumbnail}" class="w-24 h-14 object-cover rounded-lg flex-shrink-0" alt="">
                    <div class="flex-grow">
                        <h4 onclick="openWatchModal('${v.id}')" class="text-xs font-bold text-white line-clamp-2 cursor-pointer">${v.title}</h4>
                        <p class="text-[10px] text-zinc-400 mt-1">${v.views}</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // DOWNLOAD SYSTEM
        function downloadVideoById(videoId) {
            const video = sampleVideos.find(v => v.id === videoId);
            if (!video) return;

            if (downloadedVideos.some(item => item.id === video.id)) {
                alert("এই ভিডিওটি ইতিমধ্যে আপনার ডাউনলোড তালিকায় রয়েছে।");
                return;
            }

            downloadedVideos.push(video);
            localStorage.setItem('my_downloads', JSON.stringify(downloadedVideos));
            alert("ভিডিওটি আপনার ডাউনলোড লিস্টে সেভ করা হয়েছে!");
            updateDownloadUI();
        }

        function downloadCurrentVideo() {
            if (currentActiveVideo) {
                downloadVideoById(currentActiveVideo.id);
            }
        }

        function updateDownloadUI() {
            const container = document.getElementById('download-list-container');
            const countBadge = document.getElementById('download-count-badge');
            const statCount = document.getElementById('stat-download-count');

            countBadge.textContent = downloadedVideos.length;
            statCount.textContent = downloadedVideos.length;

            if (downloadedVideos.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">কোনো ডাউনলোডেড ভিডিও নেই।</p>';
                return;
            }

            container.innerHTML = downloadedVideos.map(v => `
                <div class="flex items-center justify-between bg-zinc-900 p-2.5 rounded-xl border border-zinc-800">
                    <div class="flex items-center gap-3">
                        <img src="${v.thumbnail}" class="w-16 h-10 object-cover rounded-lg" alt="">
                        <div>
                            <h4 onclick="openWatchModal('${v.id}')" class="text-xs font-bold text-white line-clamp-1 cursor-pointer">${v.title}</h4>
                            <p class="text-[10px] text-zinc-400">${v.duration}</p>
                        </div>
                    </div>
                    <button onclick="removeDownload('${v.id}')" class="p-1.5 text-zinc-500 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeDownload(videoId) {
            downloadedVideos = downloadedVideos.filter(v => v.id !== videoId);
            localStorage.setItem('my_downloads', JSON.stringify(downloadedVideos));
            updateDownloadUI();
        }

        function shareCurrentVideo() {
            if (currentActiveVideo) {
                navigator.clipboard.writeText(currentActiveVideo.embedUrl);
                alert("ভিডিও লিংক কপি করা হয়েছে!");
            }
        }
    </script>
</body>
</html>

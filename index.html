<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaTube - Telegram App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            -webkit-user-select: none;
            user-select: none;
        }
        .video-aspect {
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .video-aspect iframe, .video-aspect video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .nav-active {
            color: #ef4444 !important;
        }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.25s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col bg-[#0f0f0f] pb-20">

    <header id="main-header" class="sticky top-0 z-40 bg-[#0f0f0f]/95 backdrop-blur-md px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home-page')">
            <div class="bg-red-600 text-white p-1.5 rounded-xl">
                <i data-lucide="play" class="w-5 h-5 fill-white"></i>
            </div>
            <span class="font-extrabold text-lg tracking-tight text-white">Media<span class="text-red-600">Tube</span></span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="navigateTo('search-page')" class="p-2 text-zinc-300 hover:text-white rounded-full hover:bg-zinc-800">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
            <div onclick="navigateTo('profile-page')" class="w-8 h-8 rounded-full bg-zinc-700 overflow-hidden cursor-pointer border border-zinc-700 flex items-center justify-center">
                <img id="header-avatar" src="" alt="" class="w-full h-full object-cover hidden">
                <span id="header-avatar-initial" class="text-xs font-bold text-white">U</span>
            </div>
        </div>
    </header>

    <main class="flex-grow space-y-4">

        <div id="home-page" class="sub-page active p-3 space-y-4">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-medium">
                <button onclick="filterCategory('All')" class="px-3.5 py-1.5 rounded-lg bg-white text-black font-semibold whitespace-nowrap cat-btn">All</button>
                <button onclick="filterCategory('Tutorial')" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700 whitespace-nowrap cat-btn">Tutorials</button>
                <button onclick="filterCategory('Tech')" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700 whitespace-nowrap cat-btn">Tech</button>
                <button onclick="filterCategory('Music')" class="px-3.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700 whitespace-nowrap cat-btn">Music</button>
            </div>

            <div id="video-feed-container" class="space-y-5">
                <p class="text-xs text-zinc-500 text-center py-10">ফায়ারবেস থেকে ভিডিও লোড হচ্ছে...</p>
            </div>
        </div>

        <div id="watch-page" class="sub-page space-y-4">
            <div class="sticky top-0 z-50 bg-black">
                <div class="video-aspect">
                    <iframe id="video-player-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>

            <div class="p-3 space-y-4">
                <div>
                    <h1 id="watch-video-title" class="text-base font-bold text-white line-clamp-2">Title...</h1>
                    <p id="watch-video-meta" class="text-xs text-zinc-400 mt-1">0 views • Just now</p>
                </div>

                <div class="flex items-center justify-around bg-zinc-900 border border-zinc-800 rounded-xl py-2.5">
                    <button id="like-btn" onclick="toggleLikeCurrentVideo()" class="flex flex-col items-center gap-1 text-zinc-300 hover:text-white">
                        <i data-lucide="thumbs-up" class="w-5 h-5"></i>
                        <span id="watch-like-count" class="text-[11px] font-semibold">0</span>
                    </button>
                    <button onclick="downloadCurrentVideo()" class="flex flex-col items-center gap-1 text-zinc-300 hover:text-white">
                        <i data-lucide="download" class="w-5 h-5"></i>
                        <span class="text-[11px] font-semibold">Save</span>
                    </button>
                    <button onclick="shareCurrentVideo()" class="flex flex-col items-center gap-1 text-zinc-300 hover:text-white">
                        <i data-lucide="share-2" class="w-5 h-5"></i>
                        <span class="text-[11px] font-semibold">Share</span>
                    </button>
                </div>

                <div class="bg-zinc-900/80 p-3 rounded-xl border border-zinc-800 text-xs text-zinc-300 space-y-2">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-red-600 flex items-center justify-center font-bold text-white text-[10px]">M</div>
                        <div>
                            <p id="watch-channel-name" class="font-bold text-white text-xs">MediaTube Official</p>
                            <p class="text-[10px] text-zinc-400">Verified Creator</p>
                        </div>
                    </div>
                    <p id="watch-video-desc" class="text-zinc-400 pt-1 text-xs">No description available.</p>
                </div>

                <div class="space-y-3 pt-2">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <span>Comments</span>
                        <span id="comments-count" class="text-xs text-zinc-400 font-normal">(0)</span>
                    </h3>

                    <div class="flex items-center gap-2">
                        <input type="text" id="comment-input" placeholder="Add a public comment..." class="flex-grow bg-zinc-900 border border-zinc-700 rounded-xl py-2 px-3 text-xs text-white focus:outline-none focus:border-red-500">
                        <button onclick="submitComment()" class="bg-red-600 hover:bg-red-700 text-white p-2 rounded-xl flex items-center justify-center">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div id="comments-container" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                        </div>
                </div>

                <hr class="border-zinc-800 my-4">

                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-white">Suggested Videos</h3>
                    <div id="suggested-videos-container" class="space-y-4">
                        </div>
                </div>
            </div>
        </div>

        <div id="search-page" class="sub-page p-3 space-y-4">
            <div class="relative">
                <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Search videos, tutorials..." class="w-full bg-zinc-900 border border-zinc-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-red-500">
                <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
            </div>

            <div id="search-results-container" class="space-y-4">
                <p class="text-xs text-zinc-500 text-center py-8">ভিডিও খুঁজতে উপরে টাইপ করুন...</p>
            </div>
        </div>

        <div id="download-page" class="sub-page p-3 space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="download" class="w-5 h-5 text-red-500"></i>
                    <span>Saved Videos</span>
                </h2>
                <span id="download-count-badge" class="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-full font-bold">0</span>
            </div>

            <div id="download-list-container" class="space-y-3">
                </div>
        </div>

        <div id="profile-page" class="sub-page p-3 space-y-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center space-y-3 relative overflow-hidden">
                <div class="w-20 h-20 mx-auto rounded-full bg-zinc-800 border-2 border-red-600 overflow-hidden flex items-center justify-center shadow-lg">
                    <img id="profile-pic" src="" alt="Profile" class="w-full h-full object-cover hidden">
                    <span id="profile-initial" class="text-2xl font-bold text-zinc-300">U</span>
                </div>

                <div>
                    <h3 id="profile-name" class="text-lg font-bold text-white">User</h3>
                    <p id="profile-username" class="text-xs text-zinc-400">@username</p>
                </div>

                <div class="pt-3 border-t border-zinc-800/80 grid grid-cols-1 gap-2 text-left text-xs">
                    <div class="bg-zinc-800/60 p-2.5 rounded-xl flex items-center gap-3">
                        <i data-lucide="id-card" class="w-4 h-4 text-red-500"></i>
                        <div>
                            <p class="text-[10px] text-zinc-500 uppercase font-bold">Telegram ID</p>
                            <p id="profile-id" class="font-mono text-zinc-200">N/A</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">Saved Videos</p>
                    <p id="stat-download-count" class="text-lg font-black text-red-500">0</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl">
                    <p class="text-[10px] text-zinc-500 uppercase font-bold">App Version</p>
                    <p class="text-lg font-black text-zinc-300">v2.5</p>
                </div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0f0f0f]/95 backdrop-blur-md border-t border-zinc-800 flex justify-around items-center py-2 z-40">
        <button onclick="navigateTo('home-page')" class="nav-item active flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="home-page">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span>Home</span>
        </button>
        <button onclick="navigateTo('search-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="search-page">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span>Search</span>
        </button>
        <button onclick="navigateTo('download-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="download-page">
            <i data-lucide="download" class="w-5 h-5"></i>
            <span>Downloads</span>
        </button>
        <button onclick="navigateTo('profile-page')" class="nav-item flex flex-col items-center gap-1 text-zinc-400 text-[10px] font-medium" data-page="profile-page">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span>Profile</span>
        </button>
    </nav>

    <script>
        // ============================================================
        // 1. FIREBASE CONFIGURATION (আপনার আসল ক্রেডেনশিয়াল দিন)
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase (যদি অলরেডি কনফিগার করা থাকে)
        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch(e) {
            console.log("Firebase Init error or fallback to local handling:", e);
        }

        // ============================================================
        // GLOBAL DATA STATE
        // ============================================================
        let videosDatabase = []; // Firebase থেকে ডাটা এখানে আসবে
        let currentActiveVideo = null;
        let downloadedVideos = JSON.parse(localStorage.getItem('my_downloads') || '[]');
        let currentUser = { name: "User", username: "username", photo: "" };

        window.onload = () => {
            lucide.createIcons();
            initTelegramProfile();
            fetchVideosFromFirebase();
            updateDownloadUI();
        };

        // TELEGRAM PROFILE INITIALIZATION
        function initTelegramProfile() {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();

                const user = window.Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || "Telegram User";
                    currentUser.name = fullName;
                    currentUser.username = user.username ? `@${user.username}` : "No Username";
                    currentUser.photo = user.photo_url || "";

                    document.getElementById('profile-name').textContent = currentUser.name;
                    document.getElementById('profile-username').textContent = currentUser.username;
                    document.getElementById('profile-id').textContent = user.id || "N/A";

                    if (user.photo_url) {
                        document.getElementById('profile-pic').src = user.photo_url;
                        document.getElementById('profile-pic').classList.remove('hidden');
                        document.getElementById('profile-initial').classList.add('hidden');

                        document.getElementById('header-avatar').src = user.photo_url;
                        document.getElementById('header-avatar').classList.remove('hidden');
                        document.getElementById('header-avatar-initial').classList.add('hidden');
                    } else {
                        const initial = (user.first_name?.[0] || 'U').toUpperCase();
                        document.getElementById('profile-initial').textContent = initial;
                        document.getElementById('header-avatar-initial').textContent = initial;
                    }
                }
            } catch (e) {
                console.log("Telegram SDK Error:", e);
            }
        }

        // ============================================================
        // FETCH DATA FROM FIREBASE (Firestore Database Structure)
        // ============================================================
        function fetchVideosFromFirebase() {
            if (!db) {
                // ফায়ারবেস কানেক্ট না থাকলে নোটিফিকেশন বা লোকাল ফাঁকা ডাটা
                renderVideoFeed([]);
                return;
            }

            db.collection("videos").get().then((querySnapshot) => {
                videosDatabase = [];
                querySnapshot.forEach((doc) => {
                    videosDatabase.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                renderVideoFeed(videosDatabase);
            }).catch((error) => {
                console.error("Error getting videos from Firebase: ", error);
                document.getElementById('video-feed-container').innerHTML = 
                    '<p class="text-xs text-zinc-500 text-center py-10">ভিডিও লোড করতে ব্যর্থ হয়েছে। ফায়ারবেস কনফিগারেশন চেক করুন।</p>';
            });
        }

        // NAVIGATION LOGIC
        function navigateTo(pageId) {
            document.querySelectorAll('.sub-page').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('nav-active', btn.dataset.page === pageId);
            });

            // প্লেয়ার পেজ ছেড়ে অন্য পেজে গেলে ভিডিও স্টপ করা
            if (pageId !== 'watch-page') {
                document.getElementById('video-player-iframe').src = "";
            }

            if (pageId === 'download-page') updateDownloadUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        // RENDER HOME FEED
        function renderVideoFeed(videos) {
            const container = document.getElementById('video-feed-container');
            if (videos.length === 0) {
                container.innerHTML = '<p class="text-zinc-500 text-center py-10 text-xs">কোনো ভিডিও পাওয়া যায়নি। ফায়ারবেসে ভিডিও যোগ করুন।</p>';
                return;
            }

            container.innerHTML = videos.map(v => `
                <div class="bg-zinc-900/90 rounded-2xl overflow-hidden border border-zinc-800/80 shadow-md">
                    <div class="video-aspect cursor-pointer" onclick="openWatchPage('${v.id}')">
                        <img src="${v.thumbnail}" alt="${v.title}" class="absolute top-0 left-0 w-full h-full object-cover">
                        <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${v.duration || '00:00'}</span>
                    </div>

                    <div class="p-3 flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-red-600/20 text-red-500 flex items-center justify-center font-bold text-xs flex-shrink-0">
                            <i data-lucide="play" class="w-4 h-4 fill-red-500"></i>
                        </div>
                        <div class="flex-grow">
                            <h3 onclick="openWatchPage('${v.id}')" class="font-bold text-sm text-white line-clamp-2 cursor-pointer hover:text-red-400">${v.title}</h3>
                            <p class="text-xs text-zinc-400 mt-1">${v.category || 'General'} • ${v.views || '0'} views</p>
                        </div>
                        <button onclick="downloadVideoById('${v.id}')" class="p-1.5 text-zinc-400 hover:text-red-500 rounded-lg">
                            <i data-lucide="download" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // ============================================================
        // WATCH PAGE LOGIC (REAL YOUTUBE FEEL)
        // ============================================================
        function openWatchPage(videoId) {
            const video = videosDatabase.find(v => v.id === videoId);
            if (!video) return;

            currentActiveVideo = video;

            // YouTube Embed URL Set
            const embedUrl = video.embedUrl || `https://www.youtube.com/embed/${video.youtubeId || videoId}`;
            document.getElementById('video-player-iframe').src = embedUrl + "?autoplay=1";
            
            document.getElementById('watch-video-title').textContent = video.title;
            document.getElementById('watch-video-meta').textContent = `${video.views || '0'} views • ${video.category || 'General'}`;
            document.getElementById('watch-video-desc').textContent = video.desc || "No description provided.";
            document.getElementById('watch-like-count').textContent = video.likes || 0;

            // Render Comments & Suggested
            renderComments(video.comments || []);
            renderSuggestedVideos(videoId);

            // Reset Like Button UI
            const likeBtn = document.getElementById('like-btn');
            likeBtn.classList.remove('text-red-500');
            likeBtn.classList.add('text-zinc-300');

            navigateTo('watch-page');
        }

        // RENDER SUGGESTED VIDEOS BELOW PLAYER
        function renderSuggestedVideos(currentId) {
            const container = document.getElementById('suggested-videos-container');
            const suggested = videosDatabase.filter(v => v.id !== currentId);

            if (suggested.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-4">কোনো সাজেস্টেড ভিডিও নেই।</p>';
                return;
            }

            container.innerHTML = suggested.map(v => `
                <div class="flex items-center gap-3 bg-zinc-900/80 p-2 rounded-xl border border-zinc-800/80 cursor-pointer hover:bg-zinc-800/50" onclick="openWatchPage('${v.id}')">
                    <div class="w-28 h-16 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0 relative">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover" alt="">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-[9px] font-bold px-1 rounded text-white">${v.duration || ''}</span>
                    </div>
                    <div class="flex-grow overflow-hidden">
                        <h4 class="text-xs font-bold text-white line-clamp-2">${v.title}</h4>
                        <p class="text-[10px] text-zinc-400 mt-1">${v.views || '0'} views</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // ============================================================
        // LIKE & COMMENT SYSTEM
        // ============================================================
        function toggleLikeCurrentVideo() {
            if (!currentActiveVideo) return;

            const likeBtn = document.getElementById('like-btn');
            const likeCountEl = document.getElementById('watch-like-count');

            let currentLikes = parseInt(likeCountEl.textContent) || 0;

            if (likeBtn.classList.contains('text-red-500')) {
                // Unlike
                currentLikes--;
                likeBtn.classList.remove('text-red-500');
                likeBtn.classList.add('text-zinc-300');
            } else {
                // Like
                currentLikes++;
                likeBtn.classList.add('text-red-500');
                likeBtn.classList.remove('text-zinc-300');
            }

            likeCountEl.textContent = currentLikes;
            currentActiveVideo.likes = currentLikes;

            // Update in Firebase Firestore
            if (db && currentActiveVideo.id) {
                db.collection("videos").doc(currentActiveVideo.id).update({
                    likes: currentLikes
                }).catch(err => console.log("Firebase Update Error:", err));
            }
        }

        function renderComments(comments) {
            const container = document.getElementById('comments-container');
            document.getElementById('comments-count').textContent = `(${comments.length})`;

            if (comments.length === 0) {
                container.innerHTML = '<p class="text-[11px] text-zinc-500 py-2">কোনো কমেন্ট নেই। প্রথম কমেন্ট করুন!</p>';
                return;
            }

            container.innerHTML = comments.map(c => `
                <div class="bg-zinc-900/60 p-2.5 rounded-xl border border-zinc-800/60 space-y-1">
                    <div class="flex items-center gap-2">
                        <div class="w-5 h-5 rounded-full bg-zinc-700 text-white flex items-center justify-center text-[9px] font-bold">
                            ${c.user ? c.user[0].toUpperCase() : 'U'}
                        </div>
                        <span class="text-[11px] font-bold text-zinc-300">${c.user || 'User'}</span>
                    </div>
                    <p class="text-xs text-zinc-200 pl-7">${c.text}</p>
                </div>
            `).join('');
        }

        function submitComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();

            if (!text || !currentActiveVideo) return;

            const newComment = {
                user: currentUser.name,
                text: text,
                timestamp: new Date().toISOString()
            };

            if (!currentActiveVideo.comments) currentActiveVideo.comments = [];
            currentActiveVideo.comments.unshift(newComment);

            renderComments(currentActiveVideo.comments);
            input.value = "";

            // Firebase-এ কমেন্ট সংরক্ষণ
            if (db && currentActiveVideo.id) {
                db.collection("videos").doc(currentActiveVideo.id).update({
                    comments: firebase.firestore.FieldValue.arrayUnion(newComment)
                }).catch(err => console.log("Firebase Comment Error:", err));
            }
        }

        // SEARCH FUNCTIONALITY
        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('search-results-container');

            if (!query) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">ভিডিও খুঁজতে উপরে টাইপ করুন...</p>';
                return;
            }

            const results = videosDatabase.filter(v => 
                v.title.toLowerCase().includes(query) || 
                (v.category && v.category.toLowerCase().includes(query))
            );

            if (results.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">কোনো ফলাফল পাওয়া যায়নি।</p>';
                return;
            }

            container.innerHTML = results.map(v => `
                <div class="flex items-center gap-3 bg-zinc-900 p-2 rounded-xl border border-zinc-800" onclick="openWatchPage('${v.id}')">
                    <img src="${v.thumbnail}" class="w-24 h-14 object-cover rounded-lg flex-shrink-0" alt="">
                    <div class="flex-grow">
                        <h4 class="text-xs font-bold text-white line-clamp-2 cursor-pointer">${v.title}</h4>
                        <p class="text-[10px] text-zinc-400 mt-1">${v.views || '0'} views</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // CATEGORY FILTER
        function filterCategory(cat) {
            if (cat === 'All') {
                renderVideoFeed(videosDatabase);
            } else {
                const filtered = videosDatabase.filter(v => v.category === cat);
                renderVideoFeed(filtered);
            }
        }

        // DOWNLOAD SYSTEM
        function downloadVideoById(videoId) {
            const video = videosDatabase.find(v => v.id === videoId);
            if (!video) return;

            if (downloadedVideos.some(item => item.id === video.id)) {
                alert("এই ভিডিওটি ইতিমধ্যে আপনার সেভ করা তালিকায় রয়েছে।");
                return;
            }

            downloadedVideos.push(video);
            localStorage.setItem('my_downloads', JSON.stringify(downloadedVideos));
            alert("ভিডিওটি আপনার ওয়াচ-লেটার তালিকায় সেভ করা হয়েছে!");
            updateDownloadUI();
        }

        function downloadCurrentVideo() {
            if (currentActiveVideo) downloadVideoById(currentActiveVideo.id);
        }

        function updateDownloadUI() {
            const container = document.getElementById('download-list-container');
            const countBadge = document.getElementById('download-count-badge');
            const statCount = document.getElementById('stat-download-count');

            countBadge.textContent = downloadedVideos.length;
            statCount.textContent = downloadedVideos.length;

            if (downloadedVideos.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-8">কোনো সেভ করা ভিডিও নেই।</p>';
                return;
            }

            container.innerHTML = downloadedVideos.map(v => `
                <div class="flex items-center justify-between bg-zinc-900 p-2.5 rounded-xl border border-zinc-800">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="openWatchPage('${v.id}')">
                        <img src="${v.thumbnail}" class="w-16 h-10 object-cover rounded-lg" alt="">
                        <div>
                            <h4 class="text-xs font-bold text-white line-clamp-1">${v.title}</h4>
                            <p class="text-[10px] text-zinc-400">${v.duration || ''}</p>
                        </div>
                    </div>
                    <button onclick="removeDownload('${v.id}')" class="p-1.5 text-zinc-500 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeDownload(videoId) {
            downloadedVideos = downloadedVideos.filter(v => v.id !== videoId);
            localStorage.setItem('my_downloads', JSON.stringify(downloadedVideos));
            updateDownloadUI();
        }

        function shareCurrentVideo() {
            if (currentActiveVideo) {
                const videoUrl = currentActiveVideo.embedUrl || `https://youtu.be/${currentActiveVideo.id}`;
                navigator.clipboard.writeText(videoUrl);
                alert("ভিডিও লিংক কপি করা হয়েছে!");
            }
        }
    </script>
</body>
</html>
